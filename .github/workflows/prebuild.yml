name: Prebuild dependabot PRs

on:
  pull_request:
    branches: main 

jobs:
  build:
    if: github.actor == 'dependabot[bot]' 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build script
        run: npm run build
